name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Triggers on push to main
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC — keeps the Chronicles skyline fresh
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping deploys (push + schedule can otherwise collide)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # REQUIRED: Chronicles generator needs full commit history

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm" # change to yarn or pnpm if needed
          cache-dependency-path: web_app/package-lock.json

      - name: Install dependencies & Build
        run: |
          cd web_app
          npm install
          npm run build # Ensure this creates the ./web_app/dist folder

      # The Coding Chronicles skyline rides along inside the main app's dist
      # folder, scoped to /chronicles. It does not touch the main app's output.
      # The page fetches ./commits.json (relative), so the subpath just works.
      - name: Build Chronicles skyline (scoped to /chronicles)
        run: |
          mkdir -p web_app/dist/chronicles
          cp web_app/chronicles/index.html web_app/dist/chronicles/index.html
          node web_app/chronicles/build-commits.mjs --out web_app/dist/chronicles/commits.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This is the magic line that points to your build folder!
          path: ./web_app/dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
